name: Build demo (Web + Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate data and scripts
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Data validator (XP budget, exits, BSB cites, reserved names)
        run: python3 tools/validate_data.py
      - name: Scripts parse
        run: |
          godot --headless --import 2>&1 | tee /tmp/import.log
          if grep -q "SCRIPT ERROR\|Parse Error" /tmp/import.log; then echo "::error::GDScript errors"; exit 1; fi

  # Plays the whole game with the autotest bot. Software rendering is slow, so this takes a while;
  # it does not block the builds, and its screenshots are not stored (Actions storage is limited).
  playthrough:
    name: Autotest playthrough (title to first Calling)
    needs: validate
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install a virtual display
        run: apt-get update && apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 xauth
      - name: Play
        run: |
          godot --headless --import || true
          HPO_SHOTS=/tmp/shots xvfb-run -a godot --path . --rendering-driver opengl3 -- --autotest 2>&1 | grep -E "pacing|autotest\] (PASS|FAILED|marks)|FAIL|SCRIPT ERROR" | tee /tmp/run.log
          grep -q "\[autotest\] PASS" /tmp/run.log

  web:
    name: Web export
    needs: validate
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import and export
        run: |
          godot --headless --import || true
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          retention-days: 1

  deploy-pages:
    name: Publish to GitHub Pages
    needs: web
    runs-on: ubuntu-22.04
    # Pages must be enabled in repo Settings -> Pages (Source: GitHub Actions). Until then this
    # step fails; it must not mark the whole build red, because the APK still built fine.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android debug APK
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import and export
        run: |
          godot --headless --import || true
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/hpo-debug.apk
          ls -la build/android
      # Published to a draft GitHub Release, never an Actions artifact: release assets do not count
      # against the repository's Actions storage. The same draft is replaced on every push.
      - name: Publish debug APK to the "debug-latest" draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "HPO debug APK (latest main)"
          body: "Debug build of the latest commit on main, for sideloading. Not for Play Console."
          draft: true
          prerelease: true
          files: build/android/hpo-debug.apk
