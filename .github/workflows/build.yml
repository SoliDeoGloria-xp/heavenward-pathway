name: Build demo (Web + Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import and export
        run: |
          godot --headless --import || true
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          retention-days: 1

  deploy-pages:
    name: Publish to GitHub Pages
    needs: web
    runs-on: ubuntu-22.04
    # Pages must be enabled in repo Settings -> Pages (Source: GitHub Actions). Until then this
    # step fails; it must not mark the whole build red, because the APK still built fine.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android debug APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import and export
        run: |
          godot --headless --import || true
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/hpo-debug.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: hpo-android-debug-apk
          path: build/android/hpo-debug.apk
          retention-days: 3
