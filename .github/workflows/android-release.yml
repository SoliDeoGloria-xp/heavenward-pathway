name: Android release (Play Console AAB)

# Manual only. Easiest (works from a phone): ONE secret, HPO_KEY_PASSPHRASE (12+ characters, long and random).
#   The first run generates an upload key, encrypts it with that passphrase and commits signing/upload.keystore.enc.
#   Later runs decrypt it. Keep the passphrase safe; with it lost, ask Google to reset the upload key.
# Or, if you already have a keystore, three secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS.
# With no secrets the build signs with a throwaway key and is for pipeline testing only.
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (integer, must increase each upload)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to players"
        required: true
        default: "0.1.0"

env:
  GODOT_VERSION: "4.3"

jobs:
  aab:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Install Android platform 36 (Play requires target API 36 for new apps from 2026-08-31)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "SDK=$SDK sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
      - name: Upload key (phone-friendly passphrase mode, full secrets, or throwaway)
        id: ks
        env:
          PASS: ${{ secrets.HPO_KEY_PASSPHRASE }}
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e
          ENC=signing/upload.keystore.enc
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/upload.keystore
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"; echo "real=yes" >> "$GITHUB_OUTPUT"
          elif [ -n "$PASS" ]; then
            if [ ${#PASS} -lt 12 ]; then echo "::error::HPO_KEY_PASSPHRASE must be at least 12 characters (the encrypted key is stored in this public repo, so make it long)."; exit 1; fi
            if [ -f "$ENC" ]; then
              echo "Decrypting the stored upload key."
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out /tmp/upload.keystore -pass env:PASS
              keytool -list -keystore /tmp/upload.keystore -storepass:env PASS > /dev/null
            else
              echo "No stored upload key yet: generating one."
              keytool -genkeypair -keystore /tmp/upload.keystore -storepass:env PASS -keypass:env PASS -alias hpo-upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Heavenward Pathway Online upload key"
              mkdir -p signing
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/upload.keystore -out "$ENC" -pass env:PASS
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              git config user.name "hpo-release-bot"; git config user.email "hpo-release-bot@users.noreply.github.com"
              git add "$ENC"
              git commit -m "Add encrypted upload key (AES-256, needs HPO_KEY_PASSPHRASE) [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
              echo "generated=yes" >> "$GITHUB_OUTPUT"
            fi
            echo "mode=passphrase" >> "$GITHUB_OUTPUT"; echo "alias=hpo-upload" >> "$GITHUB_OUTPUT"; echo "real=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secret set: signing with a THROWAWAY key. This AAB is for pipeline testing only; do not upload it to Play."
            keytool -genkeypair -keystore /tmp/upload.keystore -storepass throwaway -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 365 -dname "CN=HPO Test"
            echo "mode=throwaway" >> "$GITHUB_OUTPUT"; echo "alias=throwaway" >> "$GITHUB_OUTPUT"; echo "real=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Back up the newly generated key (encrypted, so safe to keep)
        if: steps.ks.outputs.generated == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: hpo-upload-key-ENCRYPTED-backup
          path: signing/upload.keystore.enc
          retention-days: 1
      - name: Switch preset to a Gradle AAB build
        run: |
          sed -i 's/^gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' export_presets.cfg
          sed -i 's/^gradle_build\/export_format=0/gradle_build\/export_format=1/' export_presets.cfg
          sed -i 's/^gradle_build\/min_sdk=.*/gradle_build\/min_sdk="24"/' export_presets.cfg
          sed -i 's/^gradle_build\/target_sdk=.*/gradle_build\/target_sdk="36"/' export_presets.cfg
          sed -i 's/^version\/code=.*/version\/code=${{ github.event.inputs.version_code }}/' export_presets.cfg
          sed -i 's/^version\/name=.*/version\/name="${{ github.event.inputs.version_name }}"/' export_presets.cfg
      - name: Import, install Android build template, export AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ steps.ks.outputs.alias }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.ks.outputs.mode == 'passphrase' && secrets.HPO_KEY_PASSPHRASE || steps.ks.outputs.mode == 'full' && secrets.RELEASE_KEYSTORE_PASSWORD || 'throwaway' }}
        run: |
          godot --headless --import || true
          # install the Gradle build template by hand (the CLI flag is unreliable headless in 4.3)
          rm -rf android/build && mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          mkdir -v -p build/android
          godot --headless --export-release "Android" build/android/hpo-release.aab
          ls -la build/android
          unzip -p build/android/hpo-release.aab base/manifest/AndroidManifest.xml > /tmp/manifest.pb || true
          echo "--- manifest SDK levels (must show targetSdkVersion 36) ---"
          tr -c "[:print:]" "\n" < /tmp/manifest.pb | grep -v "^.\?$" | grep -A1 -E "^(minSdkVersion|targetSdkVersion|package|versionCode|versionName)$" || true
          echo "Signed with real upload key: ${{ steps.ks.outputs.real }}"
      # The AAB goes to a GitHub Release, NOT an Actions artifact: release assets do not count against
      # the repo's Actions storage quota, artifacts do. It is a DRAFT so only repo maintainers can see it;
      # open Releases, download the .aab, upload it to Play Console (publish the draft only if you want it public).
      - name: Name the AAB
        id: name
        run: |
          SUFFIX=""
          if [ "${{ steps.ks.outputs.real }}" = "no" ]; then SUFFIX="-THROWAWAY-KEY"; fi
          FILE="hpo-${{ github.event.inputs.version_name }}-code${{ github.event.inputs.version_code }}${SUFFIX}.aab"
          cp build/android/hpo-release.aab "build/android/${FILE}"
          echo "file=build/android/${FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=aab-v${{ github.event.inputs.version_name }}-code${{ github.event.inputs.version_code }}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Publish AAB to a GitHub Release (free storage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: "HPO ${{ github.event.inputs.version_name }} (versionCode ${{ github.event.inputs.version_code }})${{ steps.ks.outputs.real == 'no' && ' THROWAWAY KEY - do not upload to Play' || '' }}"
          body: "Android App Bundle for Google Play Console. Signed with the real upload key: ${{ steps.ks.outputs.real }}."
          draft: true
          prerelease: ${{ steps.ks.outputs.real == 'no' }}
          files: ${{ steps.name.outputs.file }}
